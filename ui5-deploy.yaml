# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: hr.executive.dashboard
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://sapwdp.sinarmasmining.com:8002
          client: '100'
        app:
          name: ZHCM_EXE_DASH
          description: ZHCM_EXE_DASH
          package: ZABAP
          transport: FEDK901835
        exclude:
          - /test/
